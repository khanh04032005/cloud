services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: razzia
      POSTGRES_USER: razzia
      POSTGRES_PASSWORD: razzia
    ports:
      - "5432:5432"
    volumes:
      - streaming_pg:/var/lib/postgresql/data
      - ./packages/streaming/db/001_streaming.sql:/docker-entrypoint-initdb.d/001_streaming.sql:ro
      - ./packages/streaming/db/002_dev_outbox.sql:/docker-entrypoint-initdb.d/002_dev_outbox.sql:ro
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"

volumes:
  streaming_pg:
