root /app/web;
index index.html;

location / {
    try_files $uri $uri/ /index.html;
}

location /branding/ {
    alias /app/config/branding/;
}

location /media/ {
    alias /app/config/media/;
    types {
        image/png png;
        image/jpeg jpg;
        image/webp webp;
        image/gif gif;
        audio/mpeg mp3;
        audio/ogg ogg;
        audio/wav wav;
        video/mp4 mp4;
        video/webm webm;
    }
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff;
}
