# Apply after Helm has created razzia-web and razzia-socket Services.
apiVersion: v1
kind: ConfigMap
metadata:
  name: razzia-proxy
  namespace: razzia-test
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;

        location ~ ^/(api|health)(/|$) {
            proxy_pass http://razzia-socket:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /ws {
            proxy_pass http://razzia-socket:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://razzia-web:3000;
            proxy_set_header Host $host;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: razzia-proxy
  namespace: razzia-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: razzia-kind-proxy }
  template:
    metadata:
      labels: { app: razzia-kind-proxy }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: config
          configMap:
            name: razzia-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: razzia-proxy
  namespace: razzia-test
spec:
  selector: { app: razzia-kind-proxy }
  ports:
    - name: http
      port: 8080
      targetPort: http
