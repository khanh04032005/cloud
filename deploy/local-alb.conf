# Đóng vai ALB ở local: / → web, /api và /ws → 2 replica socket (round-robin, không sticky,
# giống ALB với target-type ip). Client của A chỉ dùng transport websocket nên không cần sticky.
upstream socket {
    server socket-1:3001;
    server socket-2:3001;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    location ~ ^/(api|health)(/|$) {
        proxy_pass http://socket;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://socket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s; # tương ứng idle_timeout của ALB
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
    }
}
