{{- if .Values.monitoring.enabled }}
{{- range $name, $app := .Values.apps }}
{{- if $app.metrics }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "razzia.fullname" $ }}-{{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "razzia.labels" (dict "root" $ "component" $name) | nindent 4 }}
    {{- with $.Values.monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames: [{{ $.Release.Namespace | quote }}]
  selector:
    matchLabels:
      {{- include "razzia.selectorLabels" (dict "root" $ "component" $name) | nindent 6 }}
  endpoints:
    - port: {{ if eq $name "socket" }}http{{ else }}metrics{{ end }}
      path: /metrics
      interval: {{ $.Values.monitoring.interval }}
      scrapeTimeout: {{ $.Values.monitoring.scrapeTimeout }}
{{- end }}
{{- end }}
{{- end }}
